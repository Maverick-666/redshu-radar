[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redshu-radar"
version = "0.1.0"
description = "A local-first Xiaohongshu product sales radar for macOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.35,<1",
]

[project.scripts]
redshu-radar = "redshu_radar.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
